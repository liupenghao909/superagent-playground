[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-playground"
version = "0.1.0"
description = "A small playground for classic agent paradigms, starting with ReAct."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "superagent-playground contributors" }]
keywords = ["agents", "react", "llm", "tool-use"]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-search-results>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
superagent = "superagent_playground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["superagent_playground"]
